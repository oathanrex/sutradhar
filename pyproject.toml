[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sutradhar"
version = "1.2.0"
description = "One thread from research to retention: verify video edits in code, in your own brand, for any creator category."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []                      # the core stays stdlib-only, on purpose
[project.optional-dependencies]
words = ["faster-whisper"]
visual = ["Pillow"]

[project.scripts]
sutra = "sutra.__main__:main"

[tool.setuptools]
package-dir = { "" = "tools" }
packages = ["sutra"]
