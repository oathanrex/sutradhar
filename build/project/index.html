<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>demo-30s - shot sheet</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0E0F12;--fg:#F4F4F2;--accent:#F2C200;--mono:JetBrains Mono;--sans:Inter Tight}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090b;color:var(--fg);font-family:var(--sans),system-ui,sans-serif;display:flex;
flex-direction:column;align-items:center;gap:18px;padding:22px}
#wrap{width:min(96vw,1100px)}
#stage{position:relative;width:100%;aspect-ratio:1920/1080;background:var(--bg);overflow:hidden;
border-radius:10px;box-shadow:0 20px 60px #0009}
.shot{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:5%}
.shot.on{display:flex}
.rise{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.words{font-weight:800;letter-spacing:-.02em;line-height:.9;text-align:center;text-transform:uppercase;
font-size:calc(var(--u)*1px)}
.accent{color:var(--accent)}
.chips{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--accent);border-radius:999px;padding:.28em .7em;color:var(--accent);
font-weight:700;font-size:calc(var(--u)*.9px)}
.chapter{text-align:center}
.chapter .no{font-family:var(--mono);font-size:calc(var(--u)*.9px);color:var(--accent);letter-spacing:.2em}
.chapter .nm{font-weight:800;font-size:calc(var(--u)*1.6px);text-transform:uppercase;line-height:.92}
.media{display:flex;flex-direction:column;gap:.6em;align-items:center;width:100%;height:100%;
justify-content:center}
.frame{width:88%;height:74%;border:2px solid #ffffff22;border-radius:8px;background:#0f1116;
display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:calc(var(--u)*.38px);
color:#8a8f98}
.cap{font-family:var(--mono);font-size:calc(var(--u)*.34px);color:var(--accent)}
#bar{display:flex;align-items:center;gap:14px;width:100%;font-family:var(--mono);font-size:13px;color:#8a8f98}
#track{flex:1;height:6px;background:#1b1e24;border-radius:3px;overflow:hidden}
#fill{height:100%;width:0;background:var(--accent)}
button{background:#14161b;color:var(--fg);border:1px solid #262a32;border-radius:7px;padding:8px 14px;
font-family:inherit;font-size:13px;cursor:pointer}
#meta{width:100%;font-family:var(--mono);font-size:12px;color:#6b7280;display:flex;justify-content:space-between}
</style></head><body>
<div id="wrap">
<div id="stage"><div class="shot" id="s0" data-kind="words" data-start="0.0" data-end="1.3"><div class="words" style="--u:118">3 TOOLS</div></div>
<div class="shot" id="s1" data-kind="screen" data-start="1.3" data-end="4.0"><div class="media"><div class="frame">broll/site.mp4</div><div class="cap"></div></div></div>
<div class="shot" id="s2" data-kind="full" data-start="4.0" data-end="6.5"><div class="media"><div class="frame">broll/desk.mp4</div><div class="cap"></div></div></div>
<div class="shot" id="s3" data-kind="words" data-start="6.5" data-end="9.0"><div class="words" style="--u:118"><span class="accent">NO</span> SETUP</div></div>
<div class="shot" id="s4" data-kind="screen" data-start="9.0" data-end="11.5"><div class="media"><div class="frame">screens/app.mp4</div><div class="cap"></div></div></div>
<div class="shot" id="s5" data-kind="chips" data-start="11.5" data-end="14.0"><div class="chips"><span class="chip" style="--u:118">FREE</span><span class="chip" style="--u:118">FAST</span></div></div>
<div class="shot" id="s6" data-kind="gif" data-start="14.0" data-end="16.5"><div class="media"><div class="frame">gifs/react.mp4</div><div class="cap"></div></div></div>
<div class="shot" id="s7" data-kind="words" data-start="16.5" data-end="19.0"><div class="words" style="--u:118">10 MINUTES</div></div>
<div class="shot" id="s8" data-kind="screen" data-start="19.0" data-end="21.5"><div class="media"><div class="frame">screens/app.mp4</div><div class="cap"></div></div></div>
<div class="shot" id="s9" data-kind="full" data-start="21.5" data-end="24.0"><div class="media"><div class="frame">broll/desk.mp4</div><div class="cap"></div></div></div>
<div class="shot" id="s10" data-kind="words" data-start="24.0" data-end="26.5"><div class="words" style="--u:118"><span class="accent">TRY</span> IT</div></div>
<div class="shot" id="s11" data-kind="full" data-start="26.5" data-end="30.0"><div class="media"><div class="frame">broll/desk.mp4</div><div class="cap"></div></div></div></div>
<div id="bar"><button onclick="toggle()">play / pause</button>
<div id="track"><div id="fill"></div></div><span id="now"></span></div>
<div id="meta"><span>demo-30s</span><span>12 shots &#183; 30.0s &#183;
1920x1080 &#183; space = play/pause</span></div>
</div>
<script>
const SHOTS = [{"start_s": 0.0, "end_s": 1.3}, {"start_s": 1.3, "end_s": 4.0}, {"start_s": 4.0, "end_s": 6.5}, {"start_s": 6.5, "end_s": 9.0}, {"start_s": 9.0, "end_s": 11.5}, {"start_s": 11.5, "end_s": 14.0}, {"start_s": 14.0, "end_s": 16.5}, {"start_s": 16.5, "end_s": 19.0}, {"start_s": 19.0, "end_s": 21.5}, {"start_s": 21.5, "end_s": 24.0}, {"start_s": 24.0, "end_s": 26.5}, {"start_s": 26.5, "end_s": 30.0}];
const DUR = 30.0;
const stage = document.getElementById('stage');
const fill = document.getElementById('fill');
const now = document.getElementById('now');
let t0 = 0, playing = false, raf = null;
function shotAt(t) { for (let i = 0; i < SHOTS.length; i++) { if (t >= SHOTS[i].start_s && t < SHOTS[i].end_s) return i; } return SHOTS.length - 1; }
function paint() {
  const t = ((performance.now() - t0) / 1000) % DUR;
  const i = shotAt(t);
  SHOTS.forEach((s, j) => {
    const el = document.getElementById('s' + j);
    if (!el) return;
    if (j === i) { if (!el.classList.contains('on')) { el.classList.remove('rise'); void el.offsetWidth; el.classList.add('on', 'rise'); } }
    else { el.classList.remove('on', 'rise'); }
  });
  fill.style.width = (t / DUR * 100) + '%';
  now.textContent = t.toFixed(1) + 's / ' + DUR + 's';
  if (playing) raf = requestAnimationFrame(paint);
}
function toggle() {
  playing = !playing;
  if (playing) { t0 = performance.now() - (rafStart || 0); paint(); } else cancelAnimationFrame(raf);
}
let rafStart = 0;
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });
t0 = performance.now();
paint();
</script>
</body></html>
